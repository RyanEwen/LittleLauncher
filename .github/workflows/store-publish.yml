name: Build Store package

# Builds the unsigned MSIX packages (x64 + ARM64) and bundles them into a single
# .msixupload, ready to be uploaded to Partner Center. The Store re-signs on ingestion.
#
# ── Why this does NOT submit to the Store ────────────────────────────────────────
# Little Launcher is a PAID product on Pricing Version 2, which rules out both
# automated submission paths Microsoft offers:
#
#   1. msstore CLI / microsoft-store-apppublisher action
#      Supported for FREE products only. Paid products are explicitly unsupported.
#      https://learn.microsoft.com/windows/apps/publish/msstore-dev-cli/github-actions
#
#   2. Microsoft Store submission API (manage.devcenter.microsoft.com, StoreBroker)
#      Cannot be used with products on "Pricing Version 2" — it returns an unknown
#      tier for pricing. Little Launcher is on Pricing Version 2 (confirmed: the
#      "Review price per market" button is present under Pricing and availability).
#      Submission flows clone the previous submission and re-commit it, so an unknown
#      pricing tier would be committed against a paid app across 240 markets.
#      https://learn.microsoft.com/windows/uwp/monetize/create-and-manage-submissions-using-windows-store-services
#
# There is a third API (api.store.microsoft.com) that does support PAID pricing, but
# it covers MSI/EXE installers only — not MSIX — so it does not apply here.
#
# So this workflow stops at producing the package. Download the artifact and upload it
# in Partner Center by hand. Re-evaluate if Microsoft adds paid-product support to the
# msstore CLI, or if the product moves off Pricing Version 2.
#
# The Store credential secrets (AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
# AZURE_AD_APPLICATION_SECRET) are currently unused for the reasons above. They and the
# Entra app registration can stay for a future re-enable, or be deleted as unused
# credentials — see LittleLauncherMSIX/set-store-secrets.ps1 to reload them.
#
# NOTE: the package is kept as a workflow ARTIFACT rather than attached to the public
# GitHub Release, so the Store build of a paid app is not published for anonymous
# download.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: store-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Private cross-promo submodule (external/promo) needs a PAT with read
          # access; add it as the SUBMODULES_TOKEN repository secret.
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build MSIX packages (x64 + ARM64, unsigned for Store)
        shell: pwsh
        run: |
          foreach ($plat in @('x64', 'ARM64')) {
            Write-Host "::group::Build $plat MSIX"
            & "$env:GITHUB_WORKSPACE\LittleLauncherMSIX\build-msix.ps1" -Platform $plat -NoSign
            if ($LASTEXITCODE -ne 0) { throw "build-msix.ps1 failed for $plat (exit $LASTEXITCODE)" }
            Write-Host "::endgroup::"
          }

      - name: Bundle packages into .msixupload
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\LittleLauncherMSIX\bin\msix-output"
          $msix = @(Get-ChildItem "$out\LittleLauncher-*.msix")
          if ($msix.Count -lt 2) { throw "Expected 2 .msix files, found $($msix.Count)" }
          $upload = "$out\LittleLauncher.msixupload"
          if (Test-Path $upload) { Remove-Item $upload -Force }
          # A .msixupload is a zip containing the per-architecture packages.
          $zip = "$out\LittleLauncher-store.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $msix.FullName -DestinationPath $zip -Force
          Move-Item $zip $upload -Force
          Write-Host "Created $upload"

      - name: Upload .msixupload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Store-msixupload
          path: LittleLauncherMSIX/bin/msix-output/LittleLauncher.msixupload
          retention-days: 90

      - name: Next steps
        shell: pwsh
        run: |
          Write-Host "::notice title=Store package ready::Download the 'Store-msixupload' artifact from this run and upload it at https://partner.microsoft.com/dashboard — automated submission is not possible for a paid product on Pricing Version 2 (see this workflow's header)."
