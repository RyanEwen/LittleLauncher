name: Publish to Microsoft Store

# Builds the unsigned MSIX packages (x64 + ARM64), bundles them into a single
# .msixupload, and submits a package update to the Microsoft Store via the
# Microsoft Store Developer CLI (msstore). The Store re-signs on ingestion.
#
# MANUAL-ONLY until the Store credentials are configured. The build and bundling steps
# work; only the final submission is blocked, because the four secrets below are not set
# (the submission step is secret-gated — without them the run still succeeds and uploads
# the .msixupload as an artifact for a manual Partner Center upload).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AZURE_AD_TENANT_ID              Microsoft Entra tenant ID
#   AZURE_AD_APPLICATION_CLIENT_ID  App registration (client/application) ID
#   AZURE_AD_APPLICATION_SECRET     Client secret for that app registration
#   SELLER_ID                       Partner Center seller / publisher ID
#
# Load them without pasting into a shell:  .\LittleLauncherMSIX\set-store-secrets.ps1
# Client secrets expire (24 months max) — rerun that script to rotate.
#
# Prerequisites: the Entra app registration must hold the "Manager" role in Partner
# Center (Account settings > User management > Microsoft Entra applications), and the
# Store app must already be published live.
# NOTE: Microsoft supports this GitHub Actions update path for FREE products only.
#
# To enable automatic publishing on release tags:
#   1. Set the four secrets (script above).
#   2. Run this workflow manually with noCommit=true — it stages a DRAFT submission in
#      Partner Center, so a misconfiguration can't ship anything live.
#   3. Confirm the draft looks right in Partner Center, then discard or publish it.
#   4. Add the tag trigger back:   on: { push: { tags: ['v*'] } }
#      Tag runs commit the submission (noCommit only applies to manual runs).

on:
  # Manual only — see the note above before adding a tag trigger back.
  workflow_dispatch:
    inputs:
      noCommit:
        description: 'Stage the submission as a draft in Partner Center instead of committing it live'
        type: boolean
        default: true

# A free product allows only one in-flight submission; serialize publishes.
concurrency:
  group: store-publish
  cancel-in-progress: false

jobs:
  store:
    runs-on: windows-2025
    env:
      # Microsoft Store product ID (from https://apps.microsoft.com/detail/9p3zzbdq6pjf)
      STORE_PRODUCT_ID: 9P3ZZBDQ6PJF

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Private cross-promo submodule (external/promo) needs a PAT with read
          # access; add it as the SUBMODULES_TOKEN repository secret.
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build MSIX packages (x64 + ARM64, unsigned for Store)
        shell: pwsh
        run: |
          foreach ($plat in @('x64', 'ARM64')) {
            Write-Host "::group::Build $plat MSIX"
            & "$env:GITHUB_WORKSPACE\LittleLauncherMSIX\build-msix.ps1" -Platform $plat -NoSign
            if ($LASTEXITCODE -ne 0) { throw "build-msix.ps1 failed for $plat (exit $LASTEXITCODE)" }
            Write-Host "::endgroup::"
          }

      - name: Bundle packages into .msixupload
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\LittleLauncherMSIX\bin\msix-output"
          $msix = @(Get-ChildItem "$out\LittleLauncher-*.msix")
          if ($msix.Count -lt 2) { throw "Expected 2 .msix files, found $($msix.Count)" }
          $upload = "$out\LittleLauncher.msixupload"
          if (Test-Path $upload) { Remove-Item $upload -Force }
          # A .msixupload is a zip containing the per-architecture packages.
          $zip = "$out\LittleLauncher-store.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $msix.FullName -DestinationPath $zip -Force
          Move-Item $zip $upload -Force
          Write-Host "Created $upload"

      - name: Upload .msixupload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Store-msixupload
          path: LittleLauncherMSIX/bin/msix-output/LittleLauncher.msixupload

      - name: Check Store credentials
        id: creds
        shell: bash
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
        run: |
          if [ -n "$TENANT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Store credentials not configured — skipping submission (artifact still uploaded)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Microsoft Store Developer CLI
        if: steps.creds.outputs.configured == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure msstore credentials
        if: steps.creds.outputs.configured == 'true'
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.AZURE_AD_TENANT_ID }}
          --sellerId ${{ secrets.SELLER_ID }}
          --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish package update to the Microsoft Store
        if: steps.creds.outputs.configured == 'true'
        shell: pwsh
        env:
          # Tag pushes commit the submission; manual runs default to a draft so the very
          # first verification can't accidentally ship a live submission.
          NO_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.noCommit }}
        run: |
          $upload = "$env:GITHUB_WORKSPACE\LittleLauncherMSIX\bin\msix-output\LittleLauncher.msixupload"
          if ($env:NO_COMMIT -eq 'true') {
            Write-Host "Draft mode (-nc): staging the submission without committing it."
            msstore publish "$upload" -id $env:STORE_PRODUCT_ID -nc
          } else {
            msstore publish "$upload" -id $env:STORE_PRODUCT_ID
          }
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed (exit $LASTEXITCODE)" }
